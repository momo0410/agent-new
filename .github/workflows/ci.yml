name: CI
on:
  push:
    branches: [master, main, "release/**"]
  pull_request:
    branches: [master, main]

jobs:
  python-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            src-python/requirements.lock
            src-python/requirements-dev.lock

      - name: Install dependencies
        working-directory: src-python
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Lint with ruff
        working-directory: src-python
        run: |
          ruff check app/core app/services/pentest_agent/tool_registry.py app/services/skill_engine/lifecycle_manager.py --output-format=github

      - name: Type check with mypy
        working-directory: src-python
        run: |
          mypy app/core --ignore-missing-imports --no-error-summary

      - name: Run backend tests
        working-directory: src-python
        run: |
          pytest tests -v --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=35

      - name: Verify supply-chain metadata
        working-directory: src-python
        run: python scripts/verify_supply_chain.py --root ..

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: src-python/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Run frontend tests
        run: npx vitest run --coverage

      - name: Build frontend
        run: npm run build

  security-scan:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit security scan
        working-directory: src-python
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          bandit -r app/ -lll -f json -o bandit-report.json

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            src-python/bandit-report.json
          retention-days: 30

      - name: Generate CycloneDX SBOM
        working-directory: src-python
        run: python scripts/generate_sbom.py --root .. --output ../sdit.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sdit-sbom
          path: sdit.cdx.json
          if-no-files-found: error
          retention-days: 30
